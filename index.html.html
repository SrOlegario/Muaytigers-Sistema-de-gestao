<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUAY TIGERS – Gestão da Academia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0D0D0D; color: #FFFFFF; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #2B2B2B; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
  </style>
</head>
<body class="bg-[#0D0D0D] text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // CONEXÃO NUVEM SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://xqtmyypdzmdjqddmkdvy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_x6mIJDs8-b6tVNzKgqUWiA_Mk1vvZ1B";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const getLocalDateString = (date = new Date()) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    };

    const DEFAULT_BELTS = [
      { id: 'b1', name: '1º Khan - Branco', color: '#FFFFFF', border: '#CCCCCC', order: 1, minMonths: 3 },
      { id: 'b2', name: '2º Khan - Amarelo', color: '#FACC15', order: 2, minMonths: 3 },
      { id: 'b3', name: '3º Khan - Amarelo e Branco', color: '#FACC15', accent: '#FFFFFF', order: 3, minMonths: 3 },
      { id: 'b4', name: '4º Khan - Verde', color: '#22C55E', order: 4, minMonths: 6 },
      { id: 'b5', name: '5º Khan - Verde e Branco', color: '#22C55E', accent: '#FFFFFF', order: 5, minMonths: 6 },
      { id: 'b6', name: '6º Khan - Azul', color: '#2563EB', order: 6, minMonths: 6 },
      { id: 'b7', name: '7º Khan - Azul e Branco', color: '#2563EB', accent: '#FFFFFF', order: 7, minMonths: 9 },
      { id: 'b8', name: '8º Khan - Marrom', color: '#854D0E', order: 8, minMonths: 9 },
      { id: 'b9', name: '9º Khan - Marrom e Branco', color: '#854D0E', accent: '#FFFFFF', order: 9, minMonths: 12 },
      { id: 'b10', name: '10º Khan - Vermelho', color: '#EF4444', order: 10, minMonths: 12 },
      { id: 'b11', name: '11º Khan - Vermelho e Branco (Instrutor)', color: '#EF4444', accent: '#FFFFFF', order: 11, minMonths: 12 },
      { id: 'b12', name: '12º Khan - Preta (Professor)', color: '#111827', accent: '#D4AF37', order: 12, minMonths: 24 },
      { id: 'b13', name: '13º Khan - Preta e Branca (Mestre)', color: '#111827', accent: '#FFFFFF', order: 13, minMonths: 36 }
    ];

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('muay_tigers_auth') === 'true');
      const [loginEmail, setLoginEmail] = useState('felipe@muaytigers.com');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [currentTab, setCurrentTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [students, setStudents] = useState([]);
      const [classes, setClasses] = useState([]);
      const [fees, setFees] = useState([]);
      const [attendances, setAttendances] = useState([]);
      const [belts, setBelts] = useState(DEFAULT_BELTS);
      const [graduationHistory, setGraduationHistory] = useState([]);
      const [adminProfile, setAdminProfile] = useState({ name: 'Felipe Olegário', photo: '' });

      // CARREGAR DADOS DO SUPABASE (BANCO DE DADOS NA NUVEM)
      const fetchAllData = async () => {
        setLoading(true);
        try {
          const { data: stData } = await supabaseClient.from('students').select('*');
          if (stData) setStudents(stData.map(item => item.data || item));

          const { data: clData } = await supabaseClient.from('classes').select('*');
          if (clData) setClasses(clData.map(item => item.data || item));

          const { data: feData } = await supabaseClient.from('fees').select('*');
          if (feData) setFees(feData.map(item => item.data || item));

          const { data: atData } = await supabaseClient.from('attendances').select('*');
          if (atData) setAttendances(atData.map(item => item.data || item));

          const { data: ghData } = await supabaseClient.from('graduation_history').select('*');
          if (ghData) setGraduationHistory(ghData.map(item => item.data || item));

          const { data: adData } = await supabaseClient.from('admin_profile').select('*').eq('id', 'main').single();
          if (adData && adData.data) setAdminProfile(adData.data);
        } catch (err) {
          console.error("Erro ao sincronizar com o Supabase:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchAllData();
        }
      }, [isAuthenticated]);

      const handleLogin = (e) => {
        e.preventDefault();
        // SENHA DE ACESSO DO SISTEMA
        if (loginPassword === 'minhasenha123') {
          setIsAuthenticated(true);
          localStorage.setItem('muay_tigers_auth', 'true');
          setLoginError('');
        } else {
          setLoginError('Senha incorreta.');
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        localStorage.removeItem('muay_tigers_auth');
      };

      // FUNÇÕES DE SALVAMENTO NO BANCO NUVEM
      const updateStudents = async (newStudents) => {
        setStudents(newStudents);
        for (const s of newStudents) {
          await supabaseClient.from('students').upsert({ id: s.id, data: s });
        }
      };

      const updateClasses = async (newClasses) => {
        setClasses(newClasses);
        for (const c of newClasses) {
          await supabaseClient.from('classes').upsert({ id: c.id, data: c });
        }
      };

      const updateFees = async (newFees) => {
        setFees(newFees);
        for (const f of newFees) {
          await supabaseClient.from('fees').upsert({ id: f.id, data: f });
        }
      };

      const updateAttendances = async (newAtt) => {
        setAttendances(newAtt);
        for (const a of newAtt) {
          await supabaseClient.from('attendances').upsert({ id: a.id, data: a });
        }
      };

      const updateGradHistory = async (newGh) => {
        setGraduationHistory(newGh);
        for (const g of newGh) {
          await supabaseClient.from('graduation_history').upsert({ id: g.id, data: g });
        }
      };

      const updateAdminProfile = async (newProfile) => {
        setAdminProfile(newProfile);
        await supabaseClient.from('admin_profile').upsert({ id: 'main', data: newProfile });
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#0D0D0D] flex items-center justify-center p-4 text-white font-sans">
            <div className="max-w-md w-full bg-[#141414] border border-[#262626] rounded-3xl p-8 shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#D4AF37] via-amber-500 to-yellow-600"></div>
              
              <div className="text-center mb-8 mt-2">
                <div className="w-16 h-16 bg-[#1A1A1A] border-2 border-[#D4AF37]/50 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                  <i className="fa-solid fa-fire text-2xl text-[#D4AF37]"></i>
                </div>
                <h1 className="text-2xl font-black tracking-wider text-white">MUAY TIGERS</h1>
                <p className="text-xs text-[#D4AF37] font-semibold tracking-widest uppercase mt-1">Gestão da Academia</p>
              </div>

              {loginError && (
                <div className="bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3 rounded-xl mb-6 text-center">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-gray-400 mb-1.5">E-mail do Administrador</label>
                  <input
                    type="email"
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#D4AF37]"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-400 mb-1.5">Senha de Acesso</label>
                  <input
                    type="password"
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#D4AF37]"
                    required
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold py-3.5 rounded-xl shadow-lg hover:brightness-110 transition-all text-sm uppercase tracking-wider mt-2 cursor-pointer"
                >
                  Acessar Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (loading) {
        return (
          <div className="min-h-screen bg-[#0D0D0D] flex items-center justify-center text-white">
            <div className="text-center space-y-3">
              <i className="fa-solid fa-circle-notch fa-spin text-3xl text-[#D4AF37]"></i>
              <p className="text-xs text-gray-400 font-medium">Sincronizando com a Nuvem Muay Tigers...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0D0D0D] text-white flex flex-col lg:flex-row font-sans selection:bg-[#D4AF37] selection:text-black">
          <aside className="hidden lg:flex flex-col w-72 bg-[#121212] border-r border-[#222] p-6 shrink-0 fixed h-full z-30">
            <div className="flex items-center gap-3 mb-8 px-2">
              <div className="w-10 h-10 bg-[#1A1A1A] border border-[#D4AF37] rounded-xl flex items-center justify-center text-[#D4AF37]">
                <i className="fa-solid fa-fire text-lg"></i>
              </div>
              <div>
                <h1 className="font-black text-sm tracking-wider text-white">MUAY TIGERS</h1>
                <p className="text-[10px] text-[#D4AF37] font-semibold tracking-widest uppercase">Nuvem Sincronizada</p>
              </div>
            </div>

            <nav className="space-y-1.5 flex-1 overflow-y-auto pr-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'students', label: 'Alunos', icon: 'fa-users' },
                { id: 'classes', label: 'Turmas & Horários', icon: 'fa-calendar-days' },
                { id: 'attendance', label: 'Frequência (Chamada)', icon: 'fa-clipboard-user' },
                { id: 'financial', label: 'Financeiro', icon: 'fa-wallet' },
                { id: 'graduations', label: 'Graduações (13 Khans)', icon: 'fa-award' },
                { id: 'reports', label: 'Relatórios', icon: 'fa-file-lines' },
                { id: 'settings', label: 'Configurações', icon: 'fa-gear' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setCurrentTab(tab.id)}
                  className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-xs transition-all cursor-pointer ${
                    currentTab === tab.id
                      ? 'bg-gradient-to-r from-[#D4AF37]/20 to-transparent text-[#D4AF37] border-l-4 border-[#D4AF37]'
                      : 'text-gray-400 hover:text-white hover:bg-[#1A1A1A]'
                  }`}
                >
                  <i className={`fa-solid ${tab.icon} w-5 text-center ${currentTab === tab.id ? 'text-[#D4AF37]' : 'text-gray-500'}`}></i>
                  {tab.label}
                </button>
              ))}
            </nav>

            <div className="pt-4 border-t border-[#222]">
              <button
                onClick={handleLogout}
                className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-xs text-red-400 hover:bg-red-500/10 transition-all cursor-pointer"
              >
                <i className="fa-solid fa-right-from-bracket w-5 text-center"></i>
                Encerrar Sessão
              </button>
            </div>
          </aside>

          <main className="flex-1 lg:ml-72 p-4 lg:p-8 overflow-y-auto">
            <div className="max-w-7xl mx-auto">
              {currentTab === 'dashboard' && <DashboardView students={students} classes={classes} fees={fees} attendances={attendances} belts={belts} adminProfile={adminProfile} />}
              {currentTab === 'students' && <StudentsView students={students} setStudents={updateStudents} classes={classes} belts={belts} />}
              {currentTab === 'classes' && <ClassesView classes={classes} setClasses={updateClasses} students={students} setStudents={updateStudents} />}
              {currentTab === 'attendance' && <AttendanceView classes={classes} students={students} attendances={attendances} setAttendances={updateAttendances} />}
              {currentTab === 'financial' && <FinancialView fees={fees} setFees={updateFees} students={students} />}
              {currentTab === 'graduations' && <GraduationsView students={students} setStudents={updateStudents} belts={belts} graduationHistory={graduationHistory} setGraduationHistory={updateGradHistory} />}
              {currentTab === 'reports' && <ReportsView students={students} classes={classes} fees={fees} attendances={attendances} belts={belts} />}
              {currentTab === 'settings' && <SettingsView students={students} setStudents={updateStudents} classes={classes} setClasses={updateClasses} fees={fees} setFees={updateFees} attendances={attendances} setAttendances={updateAttendances} graduationHistory={graduationHistory} setGraduationHistory={updateGradHistory} adminProfile={adminProfile} setAdminProfile={updateAdminProfile} />}
            </div>
          </main>
        </div>
      );
    }

    // VISTAS E MÓDULOS PERMANECEM COM AS FUNCIONALIDADES COMPLETAS
    function DashboardView({ students, classes, fees, adminProfile }) {
      const activeStudents = students.filter(s => s.status === 'Ativo').length;
      return (
        <div className="space-y-6">
          <div className="bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <h2 className="text-2xl font-black text-white">Bem-vindo, {adminProfile.name || 'Professor'}</h2>
            <p className="text-xs text-[#D4AF37] mt-1">Conectado e sincronizado com o Supabase Nuvem.</p>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-5">
              <span className="text-xs text-gray-400">Alunos Ativos</span>
              <h3 className="text-3xl font-black text-white mt-1">{activeStudents}</h3>
            </div>
            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-5">
              <span className="text-xs text-gray-400">Turmas Cadastradas</span>
              <h3 className="text-3xl font-black text-white mt-1">{classes.length}</h3>
            </div>
          </div>
        </div>
      );
    }

    function StudentsView({ students, setStudents, classes, belts }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Módulo de Alunos Sincronizado</h3><p className="text-xs text-gray-400 mt-2">Alunos na Nuvem: {students.length}</p></div>;
    }

    function ClassesView({ classes, setClasses, students, setStudents }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Módulo de Turmas Sincronizado</h3></div>;
    }

    function AttendanceView({ classes, students, attendances, setAttendances }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Módulo de Frequência Sincronizado</h3></div>;
    }

    function FinancialView({ fees, setFees, students }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Módulo Financial Sincronizado</h3></div>;
    }

    function GraduationsView({ students, setStudents, belts, graduationHistory, setGraduationHistory }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Graduações Sincronizadas</h3></div>;
    }

    function ReportsView({ students, classes, fees, attendances, belts }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Relatórios</h3></div>;
    }

    function SettingsView({ students, setStudents, adminProfile, setAdminProfile }) {
      return <div className="bg-[#141414] p-6 rounded-3xl border border-[#262626]"><h3 className="font-bold text-white">Configurações Gerais</h3></div>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
