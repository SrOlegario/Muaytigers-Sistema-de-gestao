        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? { ...fallback, ...parsed } : fallback;
      } catch {
        return fallback;
      }
    };

    const compressProfilePhoto = (file) => new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) return reject(new Error('Selecione um arquivo de imagem válido.'));
      if (file.size > 10 * 1024 * 1024) return reject(new Error('A foto deve ter até 10 MB.'));
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error('O arquivo selecionado não é uma imagem válida.'));
        image.onload = () => {
          const maxDimension = 480;
          const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          const context = canvas.getContext('2d');
          if (!context) return reject(new Error('Não foi possível processar a imagem.'));
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        image.src = String(reader.result);
      };
      reader.readAsDataURL(file);
    });

    function DashboardView({ students, classes, fees, attendances, belts, adminProfile }) {

      const paymentMethodsStats = useMemo(() => {
        const stats = { Pix: 0, Dinheiro: 0, Cartão: 0, Outros: 0 };
        fees.forEach(f => {
          if (f.status === 'Pago' && f.paymentMethod) {
            if (stats[f.paymentMethod] !== undefined) stats[f.paymentMethod] += f.amount;
            else stats.Outros += f.amount;
          }
        });
        return stats;

              </div>

                <span className="text-[10px] text-gray-400 mt-1 inline-block">Mês atual</span>
              </div>
              <div className="w-12 h-12 bg-[#D4AF37]/10 border border-[#D4AF37]/20 rounded-2xl flex items-center justify-center text-[#D4AF37]">
                <i className="fa-solid fa-wallet text-xl"></i>
              </div>
            </div>

            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-5 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Mensalidades Pendentes</span>
                <h3 className="text-3xl font-black text-amber-400 mt-1">R$ {totalPendingMonth.toFixed(2)}</h3>
                <span className="text-[10px] text-amber-400 mt-1 inline-block font-medium">Aguardando baixa</span>
              </div>
              <div className="w-12 h-12 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-center justify-center text-amber-400">
                <i className="fa-solid fa-clock-rotate-left text-xl"></i>
              </div>
            </div>

            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-5 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Turmas Ativas</span>
                <h3 className="text-3xl font-black text-white mt-1">{classes.length}</h3>
                <span className="text-[10px] text-gray-400 mt-1 inline-block">Grade horária completa</span>
              </div>
              <div className="w-12 h-12 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex items-center justify-center text-blue-400">
                <i className="fa-solid fa-dumbbell text-xl"></i>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6 lg:col-span-2">
              <h3 className="font-bold text-white text-sm mb-4">Receitas por Forma de Pagamento</h3>
              <div className="space-y-4">
                {Object.entries(paymentMethodsStats).map(([method, val], index) => {
                  const maxVal = Math.max(...Object.values(paymentMethodsStats), 1);
                  const percentage = Math.round((val / maxVal) * 100);
                  return (
                    <div key={index} className="space-y-1.5">
                      <div className="flex justify-between text-xs">
                        <span className="text-gray-300 font-medium">{method}</span>
                        <span className="text-white font-bold">R$ {val.toFixed(2)}</span>
                      </div>
                      <div className="w-full bg-[#1A1A1A] h-2.5 rounded-full overflow-hidden border border-[#2B2B2B]">
                        <div className="bg-gradient-to-r from-[#D4AF37] to-amber-500 h-full rounded-full transition-all duration-500" style={{ width: `${percentage}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-bold text-white text-sm">Central de Alertas</h3>
                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
              </div>
              <div className="space-y-3">
                <div className="bg-[#1A1A1A] border border-amber-500/20 p-3.5 rounded-xl">
                  <div className="flex items-center gap-2 text-amber-400 font-bold text-xs mb-1">
                    <i className="fa-solid fa-triangle-exclamation"></i>
                    <span>Mensalidades Vencidas</span>
                  </div>
                  <p className="text-[11px] text-gray-400">Existem mensalidades em aberto com vencimento ultrapassado.</p>
                </div>
                <div className="bg-[#1A1A1A] border border-blue-500/20 p-3.5 rounded-xl">
                  <div className="flex items-center gap-2 text-blue-400 font-bold text-xs mb-1">
                    <i className="fa-solid fa-user-plus"></i>
                    <span>Alunos Experimentais</span>
                  </div>
                  <p className="text-[11px] text-gray-400">{experimentalStudents} alunos participando de aulas experimentais este mês.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. STUDENTS MODULE (ALUNOS & FICHA COMPLETA)
    // ==========================================
    function StudentsView({ students, setStudents, classes, belts }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('Todos');
      const [classFilter, setClassFilter] = useState('Todas');
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [editingStudent, setEditingStudent] = useState(null);
      const [studentToDelete, setStudentToDelete] = useState(null);

      const [formData, setFormData] = useState({
        name: '',
        photo: '',
        birthDate: '',
        phone: '',
        address: '',
        status: 'Ativo',
        beltId: 'b1',
        classIds: [],
        monthlyFee: 150.00,
        dueDay: 10,
        notes: '',
        guardians: []
      });

      const handleOpenForm = (student = null) => {
        if (student) {
          setEditingStudent(student);
          setFormData({
            name: student.name || '',
            photo: student.photo || '',
            birthDate: student.birthDate || '',
            phone: student.phone || '',
            address: student.address || '',
            status: student.status || 'Ativo',
            beltId: student.beltId || 'b1',
            classIds: student.classIds || [],
            monthlyFee: student.monthlyFee || 150.00,
            dueDay: student.dueDay || 10,
            notes: student.notes || '',
            guardians: student.guardians || []
          });
        } else {
          setEditingStudent(null);
          setFormData({
            name: '',
            photo: '',
            birthDate: '',
            phone: '',
            address: '',
            status: 'Ativo',
            beltId: 'b1',
            classIds: classes.length > 0 ? [classes[0].id] : [],
            monthlyFee: 150.00,
            dueDay: 10,
            notes: '',
            guardians: []
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return;

        if (editingStudent) {
          setStudents(prev => prev.map(s => s.id === editingStudent.id ? { ...s, ...formData } : s));
        } else {
          const newStudent = {
            id: 's_' + Date.now(),
            enrollmentDate: getLocalDateString(),
            lastGraduationDate: getLocalDateString(),
            ...formData
          };
          setStudents(prev => [newStudent, ...prev]);
        }

        setIsModalOpen(false);
      };

      const handleToggleStatus = (id, currentStatus) => {
        const nextStatus = currentStatus === 'Ativo' ? 'Inativo' : 'Ativo';
        setStudents(prev => prev.map(s => s.id === id ? { ...s, status: nextStatus } : s));
      };

      const handleConfirmDelete = () => {
        if (!studentToDelete) return;
        setStudents(prev => prev.filter(s => s.id !== studentToDelete.id));
        setStudentToDelete(null);
        if (selectedStudent?.id === studentToDelete.id) {
          setSelectedStudent(null);
        }
      };

      const filteredStudents = students.filter(student => {
        const matchesSearch = student.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              student.phone.includes(searchTerm);
        const matchesStatus = statusFilter === 'Todos' || student.status === statusFilter;
        const matchesClass = classFilter === 'Todas' || student.classIds.includes(classFilter);
        return matchesSearch && matchesStatus && matchesClass;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Gestão de Alunos</span>
              <h2 className="text-2xl font-black text-white mt-1">Alunos Matriculados</h2>
              <p className="text-xs text-gray-400 mt-1">Cadastro completo, fichas técnicas, responsáveis e histórico individual.</p>
            </div>
            <button
              onClick={() => handleOpenForm()}
              className="bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold px-5 py-3 rounded-xl shadow-lg hover:brightness-110 transition-all text-xs uppercase tracking-wider flex items-center gap-2 cursor-pointer"
            >
              <i className="fa-solid fa-user-plus"></i> Novo Aluno
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-[#141414] border border-[#262626] rounded-2xl p-4">
            <div className="relative">
              <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-500 text-xs"></i>
              <input
                type="text"
                placeholder="Pesquisar por nome ou telefone..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl pl-10 pr-4 py-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]"
              />
            </div>
            <div>
              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
                className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]"
              >
                <option value="Todos">Status: Todos</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
                <option value="Experimental">Experimental</option>
                <option value="Suspenso">Suspenso</option>
              </select>
            </div>
            <div>
              <select
                value={classFilter}
                onChange={(e) => setClassFilter(e.target.value)}
                className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]"
              >
                <option value="Todas">Turma: Todas</option>
                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          </div>

          <div className="bg-[#141414] border border-[#262626] rounded-2xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-[#1A1A1A] border-b border-[#262626] text-[11px] text-gray-400 uppercase tracking-wider">
                    <th className="p-4">Aluno</th>
                    <th className="p-4">Graduação (Khan)</th>
                    <th className="p-4">Telefone</th>
                    <th className="p-4">Status</th>
                    <th className="p-4">Mensalidade</th>
                    <th className="p-4 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#222] text-xs">
                  {filteredStudents.length === 0 ? (
                    <tr>
                      <td colSpan="6" className="p-8 text-center text-gray-500">Nenhum aluno encontrado.</td>
                    </tr>
                  ) : (
                    filteredStudents.map(student => {
                      const belt = belts.find(b => b.id === student.beltId) || belts[0];
                      return (
                        <tr key={student.id} className="hover:bg-[#1A1A1A]/50 transition-colors">
                          <td className="p-4 font-medium text-white">
                            <div className="flex items-center gap-3">
                              <div className="w-9 h-9 bg-[#1A1A1A] border border-[#2B2B2B] rounded-full overflow-hidden flex items-center justify-center font-bold text-[#D4AF37]">
                                {student.photo ? <img src={student.photo} alt="" className="w-full h-full object-cover" /> : student.name.charAt(0)}
                              </div>
                              <div>
                                <div className="font-bold">{student.name}</div>
                                <div className="text-[10px] text-gray-400">Matrícula: {student.enrollmentDate}</div>
                              </div>
                            </div>
                          </td>
                          <td className="p-4">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#1A1A1A] border border-[#2B2B2B] text-gray-300 font-medium">
                              <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: belt.color }}></span>
                              {belt.name}
                            </span>
                          </td>
                          <td className="p-4 text-gray-300">{student.phone}</td>
                          <td className="p-4">
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                              student.status === 'Ativo' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                              student.status === 'Experimental' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' :
                              'bg-red-500/10 text-red-400 border border-red-500/20'
                            }`}>
                              {student.status}
                            </span>
                          </td>
                          <td className="p-4 text-gray-300">R$ {(student.monthlyFee || 150).toFixed(2)} (Dia {student.dueDay})</td>
                          <td className="p-4 text-right space-x-2">
                            <button
                              onClick={() => setSelectedStudent(student)}
                              title="Ficha Completa"
                              className="px-2.5 py-1.5 bg-[#1A1A1A] hover:bg-[#252525] border border-[#2B2B2B] rounded-lg text-gray-300 transition-all cursor-pointer"
                            >
                              <i className="fa-solid fa-id-card"></i>
                            </button>
                            <button
                              onClick={() => handleOpenForm(student)}
                              title="Editar"
                              className="px-2.5 py-1.5 bg-[#1A1A1A] hover:bg-[#252525] border border-[#2B2B2B] rounded-lg text-[#D4AF37] transition-all cursor-pointer"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button
                              onClick={() => handleToggleStatus(student.id, student.status)}
                              title={student.status === 'Ativo' ? 'Inativar' : 'Ativar'}
                              className="px-2.5 py-1.5 bg-[#1A1A1A] hover:bg-[#252525] border border-[#2B2B2B] rounded-lg text-amber-400 transition-all cursor-pointer"
                            >
                              <i className={`fa-solid ${student.status === 'Ativo' ? 'fa-ban' : 'fa-check'}`}></i>
                            </button>
                            <button
                              onClick={() => setStudentToDelete(student)}
                              title="Excluir Permanentemente"
                              className="px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 rounded-lg text-red-400 transition-all cursor-pointer"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141414] border border-[#262626] rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="flex justify-between items-center bg-[#1A1A1A] border-b border-[#262626] p-6">
                  <h3 className="font-bold text-white text-base">{editingStudent ? 'Editar Aluno' : 'Cadastrar Novo Aluno'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white p-2">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <form onSubmit={handleSaveStudent} className="p-6 space-y-4 max-h-[75vh] overflow-y-auto text-xs">
                  <div className="flex items-center gap-4 rounded-xl border border-[#2B2B2B] bg-[#1A1A1A] p-4">
                    <div className="w-16 h-16 rounded-full overflow-hidden border border-[#D4AF37]/40 bg-[#141414] flex items-center justify-center text-[#D4AF37] font-bold text-xl shrink-0">
                      {formData.photo ? <img src={formData.photo} alt="Foto do aluno" className="w-full h-full object-cover" /> : (formData.name.charAt(0) || '?')}
                    </div>
                    <div className="space-y-2">
                      <label className="block font-medium text-gray-300">Foto do perfil do aluno</label>
                      <input type="file" accept="image/*" onChange={async (e) => { const input = e.currentTarget; const file = input.files?.[0]; if (!file) return; try { const photo = await compressProfilePhoto(file); setFormData(prev => ({ ...prev, photo })); } catch (error) { window.alert(error.message || 'Não foi possível carregar a foto.'); } finally { input.value = ''; } }} className="block w-full text-[11px] text-gray-400 file:mr-3 file:rounded-lg file:border-0 file:bg-[#D4AF37] file:px-3 file:py-2 file:font-bold file:text-black" />
                      {formData.photo && <button type="button" onClick={() => setFormData(prev => ({ ...prev, photo: '' }))} className="text-[11px] text-red-400 hover:text-red-300">Remover foto</button>}
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Nome Completo *</label>
                      <input
                        type="text"
                        required
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Data de Nascimento</label>
                      <input
                        type="date"
                        value={formData.birthDate}
                        onChange={(e) => setFormData({ ...formData, birthDate: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Telefone / WhatsApp</label>
                      <input
                        type="text"
                        value={formData.phone}
                        onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Status do Aluno</label>
                      <select
                        value={formData.status}
                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      >
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                        <option value="Experimental">Experimental</option>
                        <option value="Suspenso">Suspenso</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Graduação Inicial (Khan)</label>
                      <select
                        value={formData.beltId}
                        onChange={(e) => setFormData({ ...formData, beltId: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      >
                        {belts.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Valor da Mensalidade (R$)</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        value={formData.monthlyFee}
                        onChange={(e) => setFormData({ ...formData, monthlyFee: parseFloat(e.target.value) || 0 })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Dia de Vencimento</label>
                      <input
                        type="number"
                        min="1"
                        max="31"
                        value={formData.dueDay}
                        onChange={(e) => setFormData({ ...formData, dueDay: parseInt(e.target.value) || 10 })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block font-medium text-gray-400 mb-1">Endereço Completo</label>
                      <input
                        type="text"
                        value={formData.address}
                        onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block font-medium text-gray-400 mb-1">Observações Gerais</label>
                      <textarea
                        rows="3"
                        value={formData.notes}
                        onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl p-4 text-white focus:outline-none focus:border-[#D4AF37]"
                      ></textarea>
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-[#262626]">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-5 py-2.5 rounded-xl bg-[#1A1A1A] text-gray-400 hover:text-white border border-[#2B2B2B]"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold shadow-lg hover:brightness-110"
                    >
                      Salvar Aluno
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {selectedStudent && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141414] border border-[#262626] rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl">
                <div className="flex justify-between items-center bg-[#1A1A1A] border-b border-[#262626] p-6">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-[#D4AF37]/10 border border-[#D4AF37]/30 rounded-xl overflow-hidden flex items-center justify-center text-[#D4AF37] font-black text-lg">
                      {selectedStudent.photo ? <img src={selectedStudent.photo} alt="" className="w-full h-full object-cover" /> : selectedStudent.name.charAt(0)}
                    </div>
                    <div>
                      <h3 className="font-bold text-white text-base">{selectedStudent.name}</h3>
                      <span className="text-[11px] text-[#D4AF37] font-semibold uppercase tracking-wider">Ficha Técnica Completa</span>
                    </div>
                  </div>
                  <button onClick={() => setSelectedStudent(null)} className="text-gray-400 hover:text-white p-2">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="bg-[#1A1A1A] border border-[#2B2B2B] p-4 rounded-xl">
                      <span className="text-gray-400 block text-[10px] uppercase font-bold">Status</span>
                      <span className="text-white font-bold text-sm mt-1 inline-block">{selectedStudent.status}</span>
                    </div>
                    <div className="bg-[#1A1A1A] border border-[#2B2B2B] p-4 rounded-xl">

                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 className="font-bold text-white text-lg">Excluir Aluno Permanentemente</h3>
                <p className="text-xs text-gray-400">
                  Tem certeza que deseja excluir o aluno <strong className="text-white">{studentToDelete.name}</strong>? Esta ação removerá o cadastro do sistema.
                </p>
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    onClick={() => setStudentToDelete(null)}
                    className="px-5 py-2.5 rounded-xl bg-[#1A1A1A] text-gray-400 hover:text-white border border-[#2B2B2B] text-xs font-medium"

                    Cancelar

                  >
                    Sim, Excluir
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. CLASSES MODULE
    // ==========================================
    function ClassesView({ classes, setClasses, students }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingClass, setEditingClass] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        schedule: '',
        maxCapacity: 20,
        ageGroup: 'Adulto',
        active: true
      });

      const handleOpenForm = (cls = null) => {
        if (cls) {
          setEditingClass(cls);
          setFormData({
            name: cls.name || '',
            schedule: cls.schedule || '',
            maxCapacity: cls.maxCapacity || 20,
            ageGroup: cls.ageGroup || 'Adulto',
            active: cls.active !== false
          });
        } else {
          setEditingClass(null);
          setFormData({
            name: '',
            schedule: '',
            maxCapacity: 20,
            ageGroup: 'Adulto',
            active: true
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveClass = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return;

        if (editingClass) {
          setClasses(prev => prev.map(c => c.id === editingClass.id ? { ...c, ...formData } : c));
        } else {
          const newClass = { id: 'c_' + Date.now(), ...formData };
          setClasses(prev => [...prev, newClass]);
        }
        setIsModalOpen(false);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Turmas & Horários</span>
              <h2 className="text-2xl font-black text-white mt-1">Grade de Treinamentos</h2>
              <p className="text-xs text-gray-400 mt-1">Gerencie os horários, capacidade e turmas de Muay Thai da academia.</p>
            </div>
            <button
              onClick={() => handleOpenForm()}
              className="bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold px-5 py-3 rounded-xl shadow-lg hover:brightness-110 transition-all text-xs uppercase tracking-wider flex items-center gap-2 cursor-pointer"
            >
              <i className="fa-solid fa-plus"></i> Nova Turma
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {classes.map(cls => {
              const enrolledCount = students.filter(s => s.classIds?.includes(cls.id) && s.status === 'Ativo').length;
              const percentage = Math.min(Math.round((enrolledCount / cls.maxCapacity) * 100), 100);

              return (
                <div key={cls.id} className="bg-[#141414] border border-[#262626] rounded-3xl p-6 flex flex-col justify-between shadow-xl relative overflow-hidden">
                  <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#D4AF37] to-amber-600"></div>
                  <div>
                    <div className="flex justify-between items-start mb-3">
                      <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-[#D4AF37]/10 text-[#D4AF37] border border-[#D4AF37]/20">
                        {cls.ageGroup}
                      </span>
                      <button
                        onClick={() => handleOpenForm(cls)}
                        className="text-gray-400 hover:text-white p-1.5 rounded-lg bg-[#1A1A1A] border border-[#2B2B2B]"
                      >
                        <i className="fa-solid fa-pen text-xs"></i>
                      </button>
                    </div>
                    <h3 className="font-bold text-white text-base mb-1">{cls.name}</h3>
                    <p className="text-xs text-gray-400 flex items-center gap-1.5 mb-4">
                      <i className="fa-regular fa-clock text-[#D4AF37]"></i> {cls.schedule}
                    </p>
                  </div>

                  <div className="space-y-3 pt-4 border-t border-[#222]">
                    <div className="flex justify-between text-xs">
                      <span className="text-gray-400">Ocupação</span>
                      <span className="text-white font-bold">{enrolledCount} / {cls.maxCapacity} alunos</span>
                    </div>
                    <div className="w-full bg-[#1A1A1A] h-2 rounded-full overflow-hidden border border-[#2B2B2B]">
                      <div className="bg-[#D4AF37] h-full rounded-full transition-all duration-500" style={{ width: `${percentage}%` }}></div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141414] border border-[#262626] rounded-3xl w-full max-w-lg p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#262626] pb-4">
                  <h3 className="font-bold text-white text-base">{editingClass ? 'Editar Turma' : 'Nova Turma'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <form onSubmit={handleSaveClass} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-medium text-gray-400 mb-1">Nome da Turma *</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                    />
                  </div>
                  <div>
                    <label className="block font-medium text-gray-400 mb-1">Horários / Dias *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Seg, Quar • 19:00 - 20:30"
                      value={formData.schedule}
                      onChange={(e) => setFormData({ ...formData, schedule: e.target.value })}
                      className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Capacidade Máxima</label>
                      <input
                        type="number"
                        value={formData.maxCapacity}
                        onChange={(e) => setFormData({ ...formData, maxCapacity: parseInt(e.target.value) || 20 })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-gray-400 mb-1">Faixa Etária</label>
                      <select
                        value={formData.ageGroup}
                        onChange={(e) => setFormData({ ...formData, ageGroup: e.target.value })}
                        className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                      >
                        <option value="Adulto">Adulto</option>
                        <option value="Infantil/Teen">Infantil/Teen</option>
                        <option value="Misto">Misto</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-[#262626]">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-5 py-2.5 rounded-xl bg-[#1A1A1A] text-gray-400 hover:text-white border border-[#2B2B2B]"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold shadow-lg"
                    >
                      Salvar Turma
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 4. ATTENDANCE MODULE
    // ==========================================
    function AttendanceView({ classes, students, attendances, setAttendances }) {
      const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || '');
      const [selectedDate, setSelectedDate] = useState(getLocalDateString());
      const [currentRecords, setCurrentRecords] = useState({});

      const enrolledStudents = students.filter(s => s.classIds?.includes(selectedClassId) && s.status === 'Ativo');

      useEffect(() => {
        const savedAttendance = attendances.find(a => a.classId === selectedClassId && a.date === selectedDate);
        setCurrentRecords(savedAttendance?.records || {});
      }, [selectedClassId, selectedDate, attendances]);

      const handleMark = (studentId, status) => {
        setCurrentRecords(prev => ({ ...prev, [studentId]: status }));
      };

      const handleSaveAttendance = () => {
        const existingIndex = attendances.findIndex(a => a.classId === selectedClassId && a.date === selectedDate);
        const newEntry = {
          id: existingIndex >= 0 ? attendances[existingIndex].id : 'att_' + Date.now(),
          classId: selectedClassId,
          date: selectedDate,
          records: currentRecords
        };

        if (existingIndex >= 0) {
          const updated = [...attendances];
          updated[existingIndex] = newEntry;
          setAttendances(updated);
        } else {
          setAttendances(prev => [newEntry, ...prev]);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Módulo de Frequência</span>
              <h2 className="text-2xl font-black text-white mt-1">Chamada Rápida de Treino</h2>
              <p className="text-xs text-gray-400 mt-1">Registre a presença e faltas dos alunos por turma e data.</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#141414] border border-[#262626] rounded-2xl p-4">
            <div>
              <label className="block text-xs font-medium text-gray-400 mb-1">Selecionar Turma</label>
              <select
                value={selectedClassId}
                onChange={(e) => setSelectedClassId(e.target.value)}
                className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]"
              >
                {classes.map(c => <option key={c.id} value={c.id}>{c.name} ({c.schedule})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-gray-400 mb-1">Data do Treino</label>
              <input
                type="date"
                value={selectedDate}
                onChange={(e) => setSelectedDate(e.target.value)}
                className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]"
              />
            </div>
          </div>

          <div className="bg-[#141414] border border-[#262626] rounded-2xl overflow-hidden shadow-xl">
            <div className="p-4 bg-[#1A1A1A] border-b border-[#262626] flex justify-between items-center text-xs">
              <span className="font-bold text-white">Alunos Matriculados nesta Turma ({enrolledStudents.length})</span>
              <button
                onClick={() => {
                  const allPresent = {};
                  enrolledStudents.forEach(s => { allPresent[s.id] = 'Presente'; });
                  setCurrentRecords(allPresent);
                }}
                className="text-[#D4AF37] font-semibold hover:underline cursor-pointer"
              >
                Marcar Todos como Presentes
              </button>
            </div>
            <div className="divide-y divide-[#222]">
              {enrolledStudents.length === 0 ? (
                <div className="p-8 text-center text-gray-500 text-xs">Nenhum aluno ativo matriculado nesta turma.</div>
              ) : (
                enrolledStudents.map(student => {
                  const currentStatus = currentRecords[student.id] || ''; 
                  return (
                    <div key={student.id} className="p-4 flex items-center justify-between text-xs hover:bg-[#1A1A1A]/40">
                      <div className="font-medium text-white">{student.name}</div>
                      <div className="flex gap-2">
                        {['Presente', 'Falta', 'Justificada'].map(status => (
                          <button
                            key={status}
                            type="button"
                            onClick={() => handleMark(student.id, status)}
                            className={`px-3 py-1.5 rounded-lg font-bold transition-all cursor-pointer ${
                              currentStatus === status
                                ? status === 'Presente' ? 'bg-emerald-500 text-black shadow' : status === 'Falta' ? 'bg-red-500 text-white shadow' : 'bg-amber-500 text-black shadow'
                                : 'bg-[#1A1A1A] text-gray-400 border border-[#2B2B2B]'
                            }`}
                          >
                            {status}
                          </button>
                        ))}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
            {enrolledStudents.length > 0 && (
              <div className="p-4 bg-[#1A1A1A] border-t border-[#262626] flex justify-end">
                <button
                  onClick={handleSaveAttendance}
                  className="bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold px-6 py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg hover:brightness-110 cursor-pointer"
                >
                  Salvar Chamada
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. FINANCIAL MODULE
    // ==========================================
    function FinancialView({ fees, setFees, students }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [targetFee, setTargetFee] = useState(null);
      const [paymentAmount, setPaymentAmount] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('Pix');

      const handleOpenPayment = (fee) => {
        setTargetFee(fee);
        setPaymentAmount(Math.max(0, Number(fee.amount || 0) - Number(fee.paidAmount || 0)));
        setIsModalOpen(true);
      };

      const handleConfirmPayment = (e) => {
        e.preventDefault();
        if (!targetFee) return;

        const received = Number(paymentAmount);
        const alreadyPaid = Number(targetFee.paidAmount || 0);
        const remaining = Math.max(0, Number(targetFee.amount || 0) - alreadyPaid);
        if (!Number.isFinite(received) || received <= 0 || received > remaining) return;

        setFees(prev => prev.map(f => f.id === targetFee.id ? {
          ...f,
          paidAmount: alreadyPaid + received,
          status: alreadyPaid + received >= Number(f.amount || 0) ? 'Pago' : 'Parcial',
          paidDate: getLocalDateString(),
          paymentMethod: paymentMethod
        } : f));

        setIsModalOpen(false);
        setTargetFee(null);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Módulo Financeiro</span>
              <h2 className="text-2xl font-black text-white mt-1">Mensalidades & Pagamentos</h2>
              <p className="text-xs text-gray-400 mt-1">Controle de recebimentos, inadimplência e baixas de mensalidades.</p>
            </div>
          </div>

          <div className="bg-[#141414] border border-[#262626] rounded-2xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-[#1A1A1A] border-b border-[#262626] text-[11px] text-gray-400 uppercase tracking-wider">
                    <th className="p-4">Aluno</th>
                    <th className="p-4">Mês / Referência</th>
                    <th className="p-4">Valor</th>
                    <th className="p-4">Vencimento</th>
                    <th className="p-4">Status</th>
                    <th className="p-4 text-right">Ação</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#222] text-xs">
                  {fees.map(fee => {
                    const student = students.find(s => s.id === fee.studentId);
                    return (
                      <tr key={fee.id} className="hover:bg-[#1A1A1A]/50">
                        <td className="p-4 font-bold text-white">{student ? student.name : 'Aluno Removido'}</td>
                        <td className="p-4 text-gray-300">{fee.monthYear}</td>
                        <td className="p-4 text-white font-bold">
                          R$ {Number(fee.amount || 0).toFixed(2)}
                          {fee.paidAmount > 0 && fee.status !== 'Pago' ? <span className="block text-[10px] text-gray-400 font-normal">Recebido: R$ {Number(fee.paidAmount).toFixed(2)}</span> : null}
                        </td>
                        <td className="p-4 text-gray-300">{fee.dueDate}</td>
                        <td className="p-4">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            fee.status === 'Pago' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                          }`}>
                            {fee.status} {fee.paymentMethod ? `(${fee.paymentMethod})` : ''}
                          </span>
                        </td>
                        <td className="p-4 text-right">
                          {fee.status !== 'Pago' ? (
                            <button
                              onClick={() => handleOpenPayment(fee)}
                              className="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 rounded-lg font-bold transition-all cursor-pointer"
                            >
                              Dar Baixa
                            </button>
                          ) : (
                            <span className="text-gray-500 font-medium">Quitado</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141414] border border-[#262626] rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#262626] pb-4">
                  <h3 className="font-bold text-white text-base">Registrar Pagamento</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <form onSubmit={handleConfirmPayment} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-medium text-gray-400 mb-1">Valor Recebido (R$)</label>
                    <input
                      type="number"
                      step="0.01"
                      min="0.01"
                      max={targetFee ? Math.max(0, Number(targetFee.amount || 0) - Number(targetFee.paidAmount || 0)) : undefined}
                      required
                      value={paymentAmount}
                      onChange={(e) => setPaymentAmount(parseFloat(e.target.value) || 0)}
                      className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                    />
                  </div>
                  <div>
                    <label className="block font-medium text-gray-400 mb-1">Forma de Pagamento</label>
                    <select
                      value={paymentMethod}
                      onChange={(e) => setPaymentMethod(e.target.value)}
                      className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                    >
                      <option value="Pix">Pix</option>
                      <option value="Dinheiro">Dinheiro</option>
                      <option value="Cartão">Cartão de Crédito/Débito</option>
                      <option value="Outros">Outros</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-[#262626]">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-5 py-2.5 rounded-xl bg-[#1A1A1A] text-gray-400 hover:text-white border border-[#2B2B2B]"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold shadow-lg hover:bg-emerald-700"
                    >
                      Confirmar Pagamento
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. GRADUATIONS MODULE
    // ==========================================
    function GraduationsView({ students, setStudents, belts, graduationHistory, setGraduationHistory }) {
      const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || '');
      const [selectedBeltId, setSelectedBeltId] = useState(belts[0]?.id || '');
      const [graduationMessage, setGraduationMessage] = useState('');

      const handlePromote = (e) => {
        e.preventDefault();
        if (!selectedStudentId || !selectedBeltId) return;

        const student = students.find(s => s.id === selectedStudentId);
        const belt = belts.find(b => b.id === selectedBeltId);
        if (!student || !belt) return;

        const currentBelt = belts.find(b => b.id === student.beltId);
        if (!currentBelt) {
          setGraduationMessage('O aluno não tem uma graduação atual válida cadastrada.');
          return;
        }
        if (Number(belt.order) !== Number(currentBelt.order) + 1) {
          setGraduationMessage('A promoção deve avançar exatamente um nível.');
          return;
        }
        const referenceDate = student.lastGraduationDate || student.enrollmentDate;
        if (!referenceDate) {
          setGraduationMessage('Cadastre a matrícula ou a data da última graduação antes de promover.');
          return;
        }
        const startDate = new Date(`${referenceDate}T00:00:00`);
        const today = new Date(`${getLocalDateString()}T00:00:00`);
        let elapsedMonths = (today.getFullYear() - startDate.getFullYear()) * 12 + today.getMonth() - startDate.getMonth();
        if (today.getDate() < startDate.getDate()) elapsedMonths -= 1;
        if (!Number.isFinite(elapsedMonths) || elapsedMonths < Number(belt.minMonths || 0)) {
          setGraduationMessage(`Ainda não cumpriu o mínimo de ${Number(belt.minMonths || 0)} meses para ${belt.name}.`);
          return;
        }

        setStudents(prev => prev.map(s => s.id === selectedStudentId ? { ...s, beltId: selectedBeltId, lastGraduationDate: getLocalDateString() } : s));
        const newRecord = {
          id: 'grad_' + Date.now(),
          studentId: student.id,
          studentName: student.name,
          previousBeltName: currentBelt.name,
          beltName: belt.name,
          date: getLocalDateString()
        };
        setGraduationHistory(prev => [newRecord, ...prev]);
        setGraduationMessage(`${student.name} promovido(a) para ${belt.name}.`);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Evolução Técnica</span>
              <h2 className="text-2xl font-black text-white mt-1">Graduações de Muay Thai (13 Khans)</h2>
              <p className="text-xs text-gray-400 mt-1">Gerencie a hierarquia oficial e promova os alunos.</p>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6 space-y-4">
              <h3 className="font-bold text-white text-base">Promover Aluno</h3>
              {graduationMessage && <p role="status" aria-live="polite" className="text-xs text-amber-300">{graduationMessage}</p>}
              <form onSubmit={handlePromote} className="space-y-4 text-xs">
                <div>
                  <label className="block font-medium text-gray-400 mb-1">Selecionar Aluno</label>
                  <select
                    value={selectedStudentId}
                    onChange={(e) => setSelectedStudentId(e.target.value)}
                    className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                  >
                    {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-medium text-gray-400 mb-1">Nova Graduação (Khan)</label>
                  <select
                    value={selectedBeltId}
                    onChange={(e) => setSelectedBeltId(e.target.value)}
                    className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-[#D4AF37]"
                  >
                    {belts.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                  </select>
                </div>
                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold py-3 rounded-xl shadow-lg uppercase tracking-wider cursor-pointer"
                >
                  Registrar Graduação
                </button>
              </form>
            </div>

            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6 lg:col-span-2 space-y-4">
              <h3 className="font-bold text-white text-base">Hierarquia Oficial de Prajieds (13 Khans)</h3>
              <div className="space-y-2.5 max-h-[400px] overflow-y-auto pr-1">
                {belts.map(belt => (
                  <div key={belt.id} className="flex justify-between items-center bg-[#1A1A1A] p-3 rounded-xl border border-[#2B2B2B]">
                    <div className="flex items-center gap-3">
                      <div className="w-5 h-5 rounded-full border border-black/40 overflow-hidden flex items-center justify-center shadow-inner" style={{ backgroundColor: belt.color }}>
                        {belt.accent && <div className="w-full h-1.5" style={{ backgroundColor: belt.accent }}></div>}
                      </div>
                      <span className="font-bold text-white text-xs">{belt.name}</span>
                    </div>
                    <span className="text-[11px] text-gray-400">Mínimo: {belt.minMonths} meses</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. REPORTS MODULE
    // ==========================================
    function ReportsView({ students, classes, fees, attendances, belts }) {
      const [reportType, setReportType] = useState('students');

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Central de Relatórios</span>
              <h2 className="text-2xl font-black text-white mt-1">Relatórios & Exportações</h2>
              <p className="text-xs text-gray-400 mt-1">Consulte listagens detalhadas e exporte dados da academia.</p>
            </div>
            <button
              onClick={() => window.print()}
              className="bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold px-5 py-3 rounded-xl shadow-lg hover:brightness-110 transition-all text-xs uppercase tracking-wider flex items-center gap-2 cursor-pointer"
            >
              <i className="fa-solid fa-print"></i> Imprimir Relatório
            </button>
          </div>

          <div className="flex gap-2 border-b border-[#262626] pb-4 overflow-x-auto">
            {[
              { id: 'students', label: 'Lista de Alunos' },
              { id: 'financial', label: 'Receitas & Financeiro' },
              { id: 'classes', label: 'Alunos por Turma' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setReportType(tab.id)}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                  reportType === tab.id ? 'bg-[#D4AF37] text-black shadow' : 'bg-[#141414] text-gray-400 border border-[#262626]'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6 shadow-xl">
            {reportType === 'students' && (
              <div className="space-y-4">
                <h3 className="font-bold text-white text-base">Relatório Geral de Alunos Ativos ({students.filter(s => s.status === 'Ativo').length})</h3>
                <div className="divide-y divide-[#222] text-xs">
                  {students.filter(s => s.status === 'Ativo').map(s => (
                    <div key={s.id} className="py-3 flex justify-between items-center">
                      <div>
                        <span className="font-bold text-white">{s.name}</span>
                        <span className="text-gray-400 ml-3">Matrícula: {s.enrollmentDate}</span>
                      </div>
                      <span className="text-[#D4AF37] font-medium">{belts.find(b => b.id === s.beltId)?.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {reportType === 'financial' && (
              <div className="space-y-4">
                <h3 className="font-bold text-base text-white">Relatório de Mensalidades & Recebimentos</h3>
                <div className="divide-y divide-[#222] text-xs">
                  {fees.map(f => {
                    const student = students.find(s => s.id === f.studentId);
                    return (
                      <div key={f.id} className="py-3 flex justify-between items-center">
                        <div>
                          <span className="font-bold text-white">{student ? student.name : 'Aluno'}</span>
                          <span className="text-gray-400 ml-3">Ref: {f.monthYear}</span>
                        </div>
                        <span className={`font-bold ${f.status === 'Pago' ? 'text-emerald-400' : 'text-amber-400'}`}>
                          R$ {f.amount.toFixed(2)} ({f.status})
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {reportType === 'classes' && (
              <div className="space-y-4">
                <h3 className="font-bold text-base text-white">Turmas & Alunos Matriculados</h3>
                {classes.map(c => {
                  const enrolled = students.filter(s => s.classIds?.includes(c.id));
                  return (
                    <div key={c.id} className="bg-[#1A1A1A] p-4 rounded-xl border border-[#2B2B2B] space-y-2">
                      <h4 className="font-bold text-white text-sm">{c.name} ({enrolled.length} alunos)</h4>
                      <div className="flex flex-wrap gap-2">
                        {enrolled.map(s => (
                          <span key={s.id} className="px-2.5 py-1 bg-[#141414] border border-[#2B2B2B] rounded-lg text-[11px] text-gray-300">
                            {s.name}
                          </span>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. SETTINGS MODULE
    // ==========================================
    function SettingsView({ students, setStudents, classes, setClasses, fees, setFees, attendances, setAttendances, graduationHistory, setGraduationHistory, adminProfile, setAdminProfile }) {
      const [importMessage, setImportMessage] = useState('');

      const handleImportJSON = (event) => {
        const input = event.currentTarget;
        const file = input.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result || ''));
            const validBackup = data && [data.students, data.classes, data.fees, data.attendances, data.graduationHistory].every(Array.isArray);
            if (!validBackup) throw new Error('Formato de backup inválido.');
            if (!window.confirm('A restauração substituirá os dados atuais deste navegador. Deseja continuar?')) return;
            setStudents(data.students);
            setClasses(data.classes);
            setFees(data.fees);
            setAttendances(data.attendances);
            setGraduationHistory(data.graduationHistory);
            if (data.adminProfile && typeof data.adminProfile === 'object') setAdminProfile(data.adminProfile);
            setImportMessage('Backup restaurado com sucesso.');
          } catch (error) {
            setImportMessage(error instanceof SyntaxError ? 'Não foi possível ler o JSON selecionado.' : (error.message || 'Backup inválido.'));
          } finally {
            input.value = '';
          }
        };
        reader.onerror = () => {
          setImportMessage('Falha ao ler o arquivo selecionado.');
          input.value = '';
        };
        reader.readAsText(file);
      };

      const handleExportJSON = () => {
        const data = { version: 1, students, classes, fees, attendances, graduationHistory, adminProfile, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `muay_tigers_backup_${getLocalDateString()}.json`;
        a.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-[#141414] border border-[#262626] rounded-3xl p-6">
            <div>
              <span className="text-[11px] font-bold text-[#D4AF37] uppercase tracking-widest">Configurações & Sistema</span>
              <h2 className="text-2xl font-black text-white mt-1">Preferências da Academia</h2>
              <p className="text-xs text-gray-400 mt-1">Dados da instituição, backup e segurança do aplicativo.</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6 space-y-4">
              <h3 className="font-bold text-white text-base">Perfil do Administrador</h3>
              <div className="flex items-center gap-4">
                <div className="w-20 h-20 rounded-full overflow-hidden border-2 border-[#D4AF37]/50 bg-[#1A1A1A] flex items-center justify-center text-[#D4AF37] font-bold text-2xl shrink-0">
                  {adminProfile.photo ? <img src={adminProfile.photo} alt="Foto do administrador" className="w-full h-full object-cover" /> : (adminProfile.name?.charAt(0) || 'P')}
                </div>
                <div className="space-y-3 flex-1">
                  <div>
                    <label className="block text-gray-400 mb-1">Nome exibido</label>
                    <input type="text" maxLength="80" value={adminProfile.name || ''} onChange={(e) => setAdminProfile(prev => ({ ...prev, name: e.target.value }))} className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-gray-400 mb-1">Foto do perfil</label>
                    <input type="file" accept="image/*" onChange={async (e) => { const input = e.currentTarget; const file = input.files?.[0]; if (!file) return; try { const photo = await compressProfilePhoto(file); setAdminProfile(prev => ({ ...prev, photo })); } catch (error) { window.alert(error.message || 'Não foi possível carregar a foto.'); } finally { input.value = ''; } }} className="block w-full text-[11px] text-gray-400 file:mr-3 file:rounded-lg file:border-0 file:bg-[#D4AF37] file:px-3 file:py-2 file:font-bold file:text-black" />
                    {adminProfile.photo && <button type="button" onClick={() => setAdminProfile(prev => ({ ...prev, photo: '' }))} className="mt-2 text-[11px] text-red-400 hover:text-red-300">Remover foto</button>}
                  </div>
                </div>
              </div>
              <h3 className="font-bold text-white text-base">Identidade da Academia</h3>
              <div className="space-y-3 text-xs">
                <div>
                  <label className="block text-gray-400 mb-1">Nome Oficial</label>
                  <input type="text" readOnly value="MUAY TIGERS – GESTÃO DA ACADEMIA" className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white" />
                </div>
                <div>
                  <label className="block text-gray-400 mb-1">Estilo Visual</label>
                  <input type="text" readOnly value="Dark & Gold (Preto & Dourado)" className="w-full bg-[#1A1A1A] border border-[#2B2B2B] rounded-xl px-4 py-2.5 text-white" />
                </div>
              </div>
            </div>

            <div className="bg-[#141414] border border-[#262626] rounded-2xl p-6 space-y-4">
              <h3 className="font-bold text-white text-base">Backup & Dados (JSON)</h3>
              <p className="text-xs text-gray-400">Exporte ou importe todos os dados da academia para segurança local.</p>
              <button
                onClick={handleExportJSON}
                className="w-full bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black font-bold py-3 rounded-xl shadow-lg uppercase tracking-wider text-xs cursor-pointer"
              >
                Exportar Backup Completo (JSON)
              </button>
              <label className="block text-xs font-medium text-gray-300 mt-4">Restaurar backup JSON</label>
              <input type="file" accept=".json,application/json" onChange={handleImportJSON} className="w-full text-xs text-gray-400 file:mr-3 file:rounded-lg file:border-0 file:bg-[#D4AF37] file:px-3 file:py-2 file:font-bold file:text-black" />
              {importMessage && <p role="status" className="text-xs text-gray-300" aria-live="polite">{importMessage}</p>}
            </div>
          </div>
        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
